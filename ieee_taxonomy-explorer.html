<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IEEE Taxonomy Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --surface: #111620;
    --surface2: #161d2a;
    --border: #1e2c42;
    --accent: #00a8ff;
    --accent2: #00ffc8;
    --accent3: #f5a623;
    --text: #c8d6e8;
    --text-dim: #5a7090;
    --text-bright: #e8f2ff;
    --l1: #00a8ff;
    --l2: #00ffc8;
    --l3: #9b7fff;
    --l4: #ff6b6b;
    --tag-bg: #0d1e32;
    --search-bg: #0d1520;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 16px;
    flex-wrap: wrap;
  }

  .logo {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .logo-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    color: var(--accent);
    background: rgba(0,168,255,0.1);
    border: 1px solid rgba(0,168,255,0.3);
    padding: 3px 8px;
    border-radius: 3px;
  }

  .logo-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-bright);
    letter-spacing: -0.01em;
  }

  .logo-sub {
    font-size: 12px;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 2px;
  }

  /* Search */
  .search-wrap {
    flex: 1;
    max-width: 400px;
    position: relative;
  }

  .search-input {
    width: 100%;
    background: var(--search-bg);
    border: 1px solid var(--border);
    color: var(--text-bright);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 9px 14px 9px 38px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input::placeholder { color: var(--text-dim); }
  .search-input:focus { border-color: var(--accent); }

  .search-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 15px;
  }

  .search-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--accent2);
    white-space: nowrap;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 8px;
  }

  .btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.05em;
    padding: 7px 12px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,168,255,0.06);
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 24px;
    padding: 10px 32px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }

  .stat-label { color: var(--text-dim); }
  .stat-val { color: var(--text-bright); font-weight: 500; }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - 103px);
  }

  /* Tree panel */
  .tree-panel {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .tree-panel::-webkit-scrollbar { width: 5px; }
  .tree-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Tree items */
  .tree-node {
    position: relative;
  }

  .node-row {
    display: flex;
    align-items: center;
    gap: 0;
    border-radius: 5px;
    cursor: pointer;
    padding: 0;
    transition: background 0.1s;
    margin-bottom: 1px;
  }

  .node-row:hover {
    background: rgba(255,255,255,0.03);
  }

  .node-row.highlight {
    background: rgba(0,168,255,0.08);
    outline: 1px solid rgba(0,168,255,0.2);
  }

  .node-indent {
    display: flex;
    align-items: stretch;
    flex-shrink: 0;
  }

  .indent-line {
    width: 20px;
    display: flex;
    justify-content: center;
    position: relative;
  }

  .indent-line::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 0; bottom: 0;
    width: 1px;
    background: var(--border);
  }

  .node-toggle {
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    flex-shrink: 0;
    margin: 3px 4px 3px 0;
    color: var(--text-dim);
    transition: all 0.15s;
    user-select: none;
  }

  .node-toggle.has-children {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .node-toggle.has-children:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .node-toggle.open { color: var(--accent); border-color: rgba(0,168,255,0.4); }

  .node-label {
    font-size: 13px;
    padding: 5px 8px 5px 2px;
    flex: 1;
    line-height: 1.3;
  }

  .node-label.l0 {
    font-weight: 600;
    font-size: 14px;
    color: var(--text-bright);
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.02em;
  }

  .node-label.l1 {
    font-weight: 500;
    color: var(--text);
  }

  .node-label.l2 {
    color: #8aa8c8;
    font-size: 12.5px;
  }

  .node-label.l3 {
    color: var(--text-dim);
    font-size: 12px;
  }

  .node-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 3px;
    margin-right: 8px;
    flex-shrink: 0;
    font-weight: 500;
  }

  .l0-tag { background: rgba(0,168,255,0.1); color: var(--l1); border: 1px solid rgba(0,168,255,0.2); }
  .l1-tag { background: rgba(0,255,200,0.07); color: var(--l2); border: 1px solid rgba(0,255,200,0.15); }
  .l2-tag { background: rgba(155,127,255,0.07); color: var(--l3); border: 1px solid rgba(155,127,255,0.15); }

  .node-children {
    overflow: hidden;
    transition: none;
  }

  .node-children.collapsed {
    display: none;
  }

  /* Count badge */
  .count-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-right: 6px;
    flex-shrink: 0;
  }

  /* Mark highlight */
  mark {
    background: rgba(245,166,35,0.25);
    color: var(--accent3);
    border-radius: 2px;
    padding: 0 1px;
  }

  /* Empty state */
  .empty-state {
    padding: 48px 32px;
    text-align: center;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }

  /* No result */
  .no-result { display: none; }
  .no-result.visible { display: block; }

  /* Scrollbar styling globally */
  * { scrollbar-width: thin; scrollbar-color: #1e2c42 transparent; }
</style>
</head>

// --- Build Tree ---
let allNodes = [];
let searchQuery = '';

function countLeaves(node) {
  if (!node.children || node.children.length === 0) return 1;
  return node.children.reduce((acc, c) => acc + (typeof c === 'string' ? 1 : countLeaves(c)), 0);
}

function countAll(node) {
  if (typeof node === 'string') return 1;
  let count = 1;
  if (node.children) {
    for (const c of node.children) count += countAll(c);
  }
  return count;
}

function buildNode(data, level, parentOpen) {
  const nodeId = `n_${allNodes.length}`;
  const isLeaf = typeof data === 'string';
  const name = isLeaf ? data : data.name;
  const children = isLeaf ? [] : (data.children || []);
  const hasChildren = children.length > 0;

  const obj = { id: nodeId, name, level, hasChildren, open: false, el: null };
  allNodes.push(obj);

  const nodeEl = document.createElement('div');
  nodeEl.className = 'tree-node';
  nodeEl.id = nodeId;

  const rowEl = document.createElement('div');
  rowEl.className = 'node-row';

  // Indent
  for (let i = 0; i < level; i++) {
    const line = document.createElement('div');
    line.className = 'indent-line';
    rowEl.appendChild(line);
  }

  // Toggle
  const toggle = document.createElement('div');
  toggle.className = 'node-toggle' + (hasChildren ? ' has-children' : '');
  if (hasChildren) toggle.textContent = '−';
  else toggle.textContent = '';
  rowEl.appendChild(toggle);

  // Label
  const label = document.createElement('div');
  label.className = `node-label l${Math.min(level, 3)}`;
  label.setAttribute('data-name', name);
  label.textContent = name;
  rowEl.appendChild(label);

  // Tag for l0 and l1
  if (level === 0) {
    const tag = document.createElement('span');
    tag.className = 'node-tag l0-tag';
    tag.textContent = `${children.length} topics`;
    rowEl.appendChild(tag);
  } else if (level === 1 && hasChildren) {
    const tag = document.createElement('span');
    tag.className = 'node-tag l1-tag';
    tag.textContent = `${children.length}`;
    rowEl.appendChild(tag);
  }

  nodeEl.appendChild(rowEl);
  obj.el = nodeEl;
  obj.rowEl = rowEl;
  obj.toggleEl = toggle;
  obj.labelEl = label;

  // Children
  if (hasChildren) {
    const childrenEl = document.createElement('div');
    childrenEl.className = 'node-children collapsed';
    if (level > 0) obj.open = false;

    for (const child of children) {
      const childNode = buildNode(child, level + 1, obj.open);
      childrenEl.appendChild(childNode.el);
    }
    nodeEl.appendChild(childrenEl);
    obj.childrenEl = childrenEl;

    rowEl.addEventListener('click', () => toggleNode(obj));
    toggle.textContent = hasChildren ? '+' : '';
  }

  return obj;
}

function toggleNode(obj) {
  if (!obj.hasChildren) return;
  obj.open = !obj.open;
  obj.childrenEl.classList.toggle('collapsed', !obj.open);
  obj.toggleEl.textContent = obj.open ? '-' : '+';
  obj.toggleEl.classList.toggle('open', obj.open);
}

function expandAll() {
  allNodes.forEach(n => {
    if (n.hasChildren) {
      n.open = true;
      n.childrenEl.classList.remove('collapsed');
      n.toggleEl.textContent = '-';
      n.toggleEl.classList.add('open');
    }
  });
}

function collapseAll() {
  allNodes.forEach(n => {
    if (n.hasChildren) {
      n.open = false;
      n.childrenEl.classList.add('collapsed');
      n.toggleEl.textContent = '+';
      n.toggleEl.classList.remove('open');
    }
  });
}

// --- Search ---
function doSearch(query) {
  searchQuery = query.trim().toLowerCase();
  const countEl = document.getElementById('searchCount');
  const noResult = document.getElementById('noResult');

  if (!searchQuery) {
    // Reset
    allNodes.forEach(n => {
      n.el.style.display = '';
      n.labelEl.textContent = n.name;
      // collapse back to default
      if (n.hasChildren) {
        if (n.level === 0) {
          n.open = true;
          n.childrenEl.classList.remove('collapsed');
          n.toggleEl.textContent = '−';
        } else {
          n.open = false;
          n.childrenEl.classList.add('collapsed');
          n.toggleEl.textContent = '+';
        }
        n.toggleEl.classList.toggle('open', n.open);
      }
    });
    countEl.textContent = '';
    noResult.classList.remove('visible');
    return;
  }

  // Find matching leaf names
  let matchCount = 0;
  const matchSet = new Set();

  // Mark matches bottom-up
  allNodes.forEach(n => {
    if (n.name.toLowerCase().includes(searchQuery)) {
      matchSet.add(n.id);
      // mark all ancestors
      markAncestors(n.id);
    }
  });

  function markAncestors(nodeId) {
    const node = allNodes.find(x => x.id === nodeId);
    if (!node) return;
    // find parent by checking DOM
    const parentNode = node.el.parentElement?.closest('.tree-node');
    if (!parentNode) return;
    matchSet.add(parentNode.id);
    markAncestors(parentNode.id);
  }

  // Apply visibility
  allNodes.forEach(n => {
    const matched = matchSet.has(n.id);
    n.el.style.display = matched ? '' : 'none';

    // Highlight label
    if (matched && n.name.toLowerCase().includes(searchQuery)) {
      const idx = n.name.toLowerCase().indexOf(searchQuery);
      const before = n.name.slice(0, idx);
      const match = n.name.slice(idx, idx + searchQuery.length);
      const after = n.name.slice(idx + searchQuery.length);
      n.labelEl.innerHTML = `${escHtml(before)}<mark>${escHtml(match)}</mark>${escHtml(after)}`;
      matchCount++;
    } else {
      n.labelEl.textContent = n.name;
    }

    // Expand if in match set
    if (matched && n.hasChildren) {
      n.open = true;
      n.childrenEl.classList.remove('collapsed');
      n.toggleEl.textContent = '−';
      n.toggleEl.classList.add('open');
    }
  });

  countEl.textContent = matchCount > 0 ? `${matchCount} match${matchCount !== 1 ? 'es' : ''}` : '';
  noResult.classList.toggle('visible', matchCount === 0);
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// --- Init ---
const root = document.getElementById('treeRoot');
TAXONOMY.forEach(item => {
  const node = buildNode(item, 0, true);
  root.appendChild(node.el);
});

let searchTimer;
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => doSearch(e.target.value), 180);
});
